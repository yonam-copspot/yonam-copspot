<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>학교 민원 인수인계 챗봇</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #f5f7fb;
      --primary: #3b82f6;
      --primary-soft: #dbeafe;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-sub: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #eff6ff, #f9fafb);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: var(--text-main);
    }

    .container {
      width: 100%;
      max-width: 980px;
      height: 90vh;
      max-height: 720px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      box-shadow:
        0 20px 40px rgba(15, 23, 42, 0.16),
        0 0 0 1px rgba(148, 163, 184, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(90deg, #eff6ff, #ffffff);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 32px;
      height: 32px;
      border-radius: 12px;
      background: conic-gradient(
        from 230deg,
        #1d4ed8,
        #22c55e,
        #f97316,
        #e11d48,
        #1d4ed8
      );
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 18px;
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.5);
    }

    .title-main { font-size: 16px; font-weight: 700; }
    .title-sub { font-size: 12px; color: var(--text-sub); }

    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: #1d4ed8;
      margin-bottom: 3px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.18);
    }
    .header-right-text {
      font-size: 11px;
      color: var(--text-sub);
      text-align: right;
    }

    .body {
      flex: 1;
      display: flex;
      padding: 14px;
      gap: 14px;
      overflow: hidden;
    }

    .sidebar {
      display: none;
    }

    @media (min-width: 900px) {
      .sidebar {
        display: flex;
        flex-direction: column;
        width: 260px;
        border-radius: 20px;
        background: #f8fafc;
        border: 1px dashed #cbd5f5;
        padding: 10px;
        font-size: 12px;
        color: var(--text-sub);
      }
    }

    .sidebar-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sidebar-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #1d4ed8;
    }
    .sidebar ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
    }
    .sidebar li {
      padding-left: 12px;
      position: relative;
    }
    .sidebar li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: #94a3b8;
    }

    .chat {
      flex: 1;
      border-radius: 22px;
      border: 1px solid var(--border);
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-top-info {
      font-size: 11px;
      color: var(--text-sub);
      text-align: center;
      padding: 6px 10px 2px;
      background: rgba(148, 163, 184, 0.08);
    }

    #chat-log {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      max-width: 100%;
    }
    .msg-row.user { justify-content: flex-end; }

    .avatar {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .avatar.assistant {
      background: #e0f2fe;
      color: #1d4ed8;
    }
    .avatar.user {
      background: #1d4ed8;
      color: #ffffff;
    }

    .bubble {
      max-width: 78%;
      padding: 8px 10px;
      font-size: 14px;
      border-radius: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }
    .bubble.assistant {
      background: #ffffff;
      border-bottom-left-radius: 4px;
    }
    .bubble.user {
      background: var(--primary);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .meta {
      font-size: 10px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .footer {
      border-top: 1px solid var(--border);
      padding: 8px 10px 10px;
      background: #ffffff;
    }

    .form {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    #user-input {
      flex: 1;
      min-height: 36px;
      max-height: 110px;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 14px;
      resize: none;
      outline: none;
      line-height: 1.4;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, border-radius 0.15s ease;
    }
    #user-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.25);
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
    }

    #send-btn {
      padding: 8px 14px;
      border-radius: 999px;
      border: none;
      background: var(--primary);
      color: white;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.35);
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.1s ease;
    }
    #send-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(37, 99, 235, 0.4);
      background: #2563eb;
    }
    #send-btn:disabled {
      opacity: 0.6;
      cursor: default;
      box-shadow: none;
      transform: none;
    }

    .status-bar {
      margin-top: 5px;
      font-size: 11px;
      color: var(--text-sub);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dots {
      display: none;
      gap: 4px;
      align-items: center;
    }
    .dots span {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #22c55e;
      animation: pulse 1s infinite ease-in-out;
    }
    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes pulse {
      0%, 100% { transform: translateY(0); opacity: 0.5; }
      50% { transform: translateY(-3px); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-left">
        <div class="logo">S</div>
        <div>
          <div class="title-main">학교 민원 인수인계 챗봇</div>
          <div class="title-sub">전임자 인수인계서 기반 관리자 Q&amp;A</div>
        </div>
      </div>
      <div>
        <div class="badge">
          <span class="badge-dot"></span>
          <span>GPT API 기반출력</span>
        </div>
        <div class="header-right-text">
          내부 참고용 · 실제 행정 결정은 담당자 권한
        </div>
      </div>
    </header>

    <main class="body">
      <aside class="sidebar">
        <div class="sidebar-title">
          <span class="sidebar-dot"></span>
          추천 질문
        </div>
        <ul>
          <li>이부분은</li>
          <li>새로</li>
          <li>만들어서</li>
          <li>적용하면될듯</li>
        </ul>
        <div style="font-size: 11px;">
          챗봇 답변은 참고용입니다.<br />
          공문 작성 / 예산 집행 등은 반드시 담당자가 최종 확인 후 결정하세요.
        </div>
      </aside>

      <section class="chat">
        <div class="chat-top-info">
          엔터 → 전송, Shift+엔터 → 줄바꿈 · 전임자 인수인계서 내용을 기반으로 답변합니다.
        </div>
        <div id="chat-log"></div>

        <footer class="footer">
          <form id="chat-form" class="form">
            <textarea
              id="user-input"
              rows="1"
              placeholder="예) 시설민원이 접수되었을 때, 인수인계서 기준 처리 절차를 알려줘."
            ></textarea>
            <button type="submit" id="send-btn">
              <span>➤</span>
              <span>전송</span>
            </button>
          </form>
          <div class="status-bar">
            <div class="dots" id="loading-dots">
              <span></span><span></span><span></span>
            </div>
            <div>답변은 인수인계서·학교 규정과 다를 수 있습니다.</div>
          </div>
        </footer>
      </section>
    </main>
  </div>

  <script>
    // 🔑 api.txt에서 불러올 API 키 변수
    let OPENAI_API_KEY = "";

    // api.txt에서 키 읽어오기
    async function loadApiKey() {
      try {
        const res = await fetch("./api.txt");
        if (!res.ok) {
          throw new Error("api.txt를 불러올 수 없습니다. (HTTP " + res.status + ")");
        }
        const text = await res.text();
        OPENAI_API_KEY = text.trim();
        console.log("API 키 로드 완료");
      } catch (err) {
        console.error("API 키 로드 실패:", err);
        appendMessage(
          "assistant",
          "⚠️ API 키를 불러오지 못했습니다. api.txt 파일 위치와 브라우저/서버 설정을 확인해 주세요."
        );
      }
    }

    // 인수인계서 요약 내용 (수정시 챗봇 성격이 바뀜)
    const HANDOVER_DOC_SUMMARY = `
- 민원 우선순위: 안전사고 우려 > 시설 파손 > 기타 불편
- 학생/학부모 응대 톤: 먼저 공감, 이후 해결 절차 안내
- 기본 처리 프로세스:
  1) 위치·상황·위험도 확인
  2) 관련 부서(행정실, 시설 담당 등) 전달
  3) 처리 예상 기간 안내
  4) 처리 후 결과 회신
- 절대 하지 말 것:
  - 특정 교사·학생 실명 언급 비난
  - 학교 규정을 임의로 변경 약속
`;

    const SYSTEM_PROMPT = `
너는 "학교 민원 처리 담당자"를 도와주는 내부용 챗봇이야.
주로 학교 관리자(행정실, 시설 담당자)가 너에게 업무 관련 질문을 한다.

아래 인수인계서 요약을 항상 기준으로 삼아서 답변해:
${HANDOVER_DOC_SUMMARY}

규칙:
- 모르는 내용은 아는 척 하지 말고, "인수인계서에 명시되지 않아 확답은 어렵습니다."라고 말해.
- 실제 결재/예산/공문과 관련된 부분은 "최종 결정은 담당자 재량"이라고 한 번은 언급해.
- 학생/학부모에게 보여줄 답변 예시를 요청하면, 정중한 존댓말 예시 문장을 2~3개 제시해.
`;

    const messages = [
      { role: "system", content: SYSTEM_PROMPT }
    ];

    const chatLogEl = document.getElementById("chat-log");
    const formEl = document.getElementById("chat-form");
    const inputEl = document.getElementById("user-input");
    const sendBtnEl = document.getElementById("send-btn");
    const loadingDotsEl = document.getElementById("loading-dots");

    function appendMessage(role, content) {
      const row = document.createElement("div");
      row.className = "msg-row " + role;

      const avatar = document.createElement("div");
      avatar.className = "avatar " + role;
      avatar.textContent = role === "user" ? "나" : "봇";

      const wrapper = document.createElement("div");
      const bubble = document.createElement("div");
      bubble.className = "bubble " + (role === "user" ? "user" : "assistant");
      bubble.textContent = content;

      const meta = document.createElement("div");
      meta.className = "meta";
      const now = new Date();
      const timeStr = now.toTimeString().slice(0, 5);
      meta.textContent = (role === "user" ? "나" : "인수인계 챗봇") + " · " + timeStr;

      wrapper.appendChild(bubble);
      wrapper.appendChild(meta);

      if (role === "user") {
        row.appendChild(wrapper);
        row.appendChild(avatar);
      } else {
        row.appendChild(avatar);
        row.appendChild(wrapper);
      }

      chatLogEl.appendChild(row);
      chatLogEl.scrollTop = chatLogEl.scrollHeight;
    }

    function setLoading(isLoading) {
      loadingDotsEl.style.display = isLoading ? "inline-flex" : "none";
      sendBtnEl.disabled = isLoading;
    }

    function autoResizeTextarea() {
      inputEl.style.height = "auto";
      inputEl.style.height = inputEl.scrollHeight + "px";
    }

    inputEl.addEventListener("input", autoResizeTextarea);

    // Enter / Shift+Enter 처리
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        formEl.requestSubmit();
      }
    });

    // OpenAI Chat Completions 호출
    async function callOpenAI() {
      if (!OPENAI_API_KEY) {
        throw new Error("API 키가 아직 로드되지 않았습니다. api.txt 또는 브라우저 설정을 확인해 주세요.");
      }

      const res = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + OPENAI_API_KEY,
        },
        body: JSON.stringify({
          model: "gpt-4.1-mini",
          messages: messages,
          temperature: 0.2,
        }),
      });

      const data = await res.json();
      if (!res.ok) {
        console.error("OpenAI error:", data);
        throw new Error(data.error?.message || "OpenAI API error");
      }

      const reply = data.choices?.[0]?.message;
      return reply;
    }

    formEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = inputEl.value.trim();
      if (!text) return;

      appendMessage("user", text);
      messages.push({ role: "user", content: text });

      inputEl.value = "";
      autoResizeTextarea();

      try {
        setLoading(true);
        const replyMsg = await callOpenAI();
        const replyText = replyMsg?.content || "답변을 가져오지 못했습니다.";
        appendMessage("assistant", replyText);
        messages.push({ role: "assistant", content: replyText });
      } catch (err) {
        console.error(err);
        appendMessage(
          "assistant",
          "⚠️ 오류가 발생했습니다: " + err.message + "\n\nAPI 키, 모델 이름, 네트워크 상태를 확인해 주세요."
        );
      } finally {
        setLoading(false);
      }
    });

    // 초기 설정
    autoResizeTextarea();
    loadApiKey(); // 페이지 로드시 api.txt에서 키 읽기
  </script>
</body>
</html>
