<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>카카오맵 호출 테스트</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <script>
      if (new URLSearchParams(window.location.search).get("embed") === "1") {
        document.body.classList.add("embed");
      }
    </script>
    <main class="app">
      <header>
        <h1>카카오맵 좌표 테스트</h1>
        <p>위도·경도를 입력하면 해당 위치로 마커를 이동합니다.</p>
      </header>

      <section class="panel">
        <form id="coords-form" class="coord-form">
          <label class="field">
            <span>위도</span>
            <input
              id="lat-input"
              name="latitude"
              type="number"
              step="any"
              inputmode="decimal"
              required
              placeholder="35.1649206"
            />
          </label>
          <label class="field">
            <span>경도</span>
            <input
              id="lng-input"
              name="longitude"
              type="number"
              step="any"
              inputmode="decimal"
              required
              placeholder="128.0993567"
            />
          </label>
          <div class="actions">
            <button type="submit">마커 이동</button>
            <button type="button" id="reset-btn" class="ghost">초기 위치</button>
          </div>
        </form>
        <p class="hint">예시: 37.5665, 126.9780</p>
        <p id="status-msg" class="status" aria-live="polite"></p>
      </section>

      <section>
        <div id="map" class="map"></div>
      </section>
    </main>

    <script src="js/config.js"></script>

    <script src="js/api/kakaomap.js"></script>

    <script src="js/main.js"></script>
  </body>
</html>
