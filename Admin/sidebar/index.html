<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sidebar</title>
    <style>
      :root {
        box-sizing: border-box;
      }
      *,
      *:before,
      *:after {
        box-sizing: inherit;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      .grid {
        display: grid;
        grid-template-columns: 7fr 3fr; /* 70% / 30% */
        gap: 0;
        height: 100vh;
      }
      .main {
        padding: 24px;
        background: #707094;
      }
      .side {
        padding: 16px;
        background: #ffffff;
        border-left: 1px solid #e6e6e6;
      }
      h1 {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <main class="main">
        <h1>Hello Node JS</h1>
      </main>
      <aside class="side" id="user-work">
        <!-- 사용자가 작업할 오른쪽 30% 영역입니다. 이곳에 자유롭게 추가하세요. -->
        <p>오른쪽 30% 영역입니다. 이곳에 컨텐츠를 넣어주세요.</p>
      </aside>
    </div>
  </body>
</html>
